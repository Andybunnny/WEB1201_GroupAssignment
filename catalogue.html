<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Catalogue - Granbakery</title>
		<link rel="stylesheet" href="css/variables.css">
		<link rel="stylesheet" href="css/styles.css">
		<link rel="stylesheet" href="css/cookies.css">
		<link rel="stylesheet" href="css/catalogue.css">
        <script>
            // Applies saved theme (Dark or Light Mode)
            const savedTheme = localStorage.getItem("bakery-theme") || "light";
            document.documentElement.setAttribute("data-theme", savedTheme);
        </script>
	</head>
	<body>
		<div class="header-nav-wrapper" id="mainHeader">
			<header>
				<a href="index.html" class="logo-link" aria-label="Go to Home Page">
					<img src="assets/img/granbakery_header_final.png" height="90" alt="Granbakery Logo" class="main-logo">
				</a>
			</header>

			<nav>
				<ul class="nav-links">
					<li><a href="index.html">Home</a></li>
					<li><a href="about.html">About</a></li>
					<li class="nav-dropdown">
						<a href="catalogue.html">Catalogue</a>
						<ul class="dropdown-menu">
							<li><a href="cookies.html">Cookies</a></li>
							<li><a href="cakes.html">Cakes</a></li>
						</ul>
					</li>
					<li><a href="reviews.html">Reviews</a></li>
					<li><a href="team.html">Our Team</a></li>
				</ul>
				<div class="nav-icons">
					<button class="theme-toggle" aria-label="Toggle theme"></button>
					<a href="login.html" aria-label="Go to login page">
						<svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
					</a>
				</div>
			</nav>
		</div>

		<main>
			<section class="category-section" id="cookiesSection">
				<br>
				<h2>Cookies</h2>
				<p class="category-subtitle">Our most loved cookie flavours, freshly baked daily</p>
				<section id="cookiesGrid" class="product-grid" aria-live="polite"></section>
				<div class="view-more-wrapper">
					<a href="cookies.html" class="view-more-btn">View All</a>
				</div>
			</section>

			<section class="category-section" id="cakesSection">
				<br>
				<h2>Cakes</h2>
				<p class="category-subtitle">Our most loved cake flavours, freshly baked daily</p>
				<section id="cakesGrid" class="product-grid" aria-live="polite"></section>
				<div class="view-more-wrapper">
					<a href="cakes.html" class="view-more-btn">View All</a>
				</div>
			</section>

			<script src="js/global.js"></script>
			<script src="js/catalogue.js"></script>
		</main>

		<footer>
			<p>Copyright 2026 &copy; Granbakery Sdn Bhd</p>
		</footer>

        <!-- NEW: Floating Cart Button -->
		<button class="floating-cart-btn" id="cartBtn" onclick="window.location.href='cart.html'">
            <span class="cart-count" id="cartCount">0</span>
        </button>

	</body>
</html>
